# Copy to values-secrets.yaml and fill in. Keep the copy out of email and git.
#
# DB_USERNAME / DB_PASSWORD must be the ones the MySQL image was BUILT with (the seed scripts
# create that account). Keep passwords alphanumeric: they end up inside XML and a JDBC config.

deploymentToml:
  superAdmin:
    # Must be an email address - the accelerator's user store regex rejects anything else.
    username: "admin@wso2.com"
    password: "<IS_ADMIN_PASSWORD>"
  database:
    identity:
      username: "<DB_USERNAME>"
      password: "<DB_PASSWORD>"
    shared:
      username: "<DB_USERNAME>"
      password: "<DB_PASSWORD>"
    user:
      username: "<DB_USERNAME>"
      password: "<DB_PASSWORD>"
    consent:
      username: "<DB_USERNAME>"
      password: "<DB_PASSWORD>"
    agentIdentity:
      username: "<DB_USERNAME>"
      password: "<DB_PASSWORD>"
