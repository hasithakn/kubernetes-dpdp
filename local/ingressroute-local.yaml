# Local (Rancher Desktop) copy of ../ingressroute.yaml: k3s's bundled Traefik, no ingress-class annotation.
#
# Sticky sessions: a login flow keeps state on the node that started it, so a browser must stay
# on one pod. HTTPS to the backend with verification off: IS listens on 9443 with its own
# self-signed certificate.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: wso2is-backend-tls
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wso2is
spec:
  routes:
    - match: Host(`wso2is-127-0-0-1.sslip.io`)
      kind: Rule
      services:
        # <release>-identity-server, from the chart's fullname helper.
        - name: wso2is-identity-server
          port: 9443
          scheme: https
          serversTransport: wso2is-backend-tls
          sticky:
            cookie:
              name: wso2is-affinity
              secure: true
              httpOnly: true
              sameSite: none
  # Traefik's default certificate; replace with a cert-manager Certificate secret if needed.
  tls: {}
