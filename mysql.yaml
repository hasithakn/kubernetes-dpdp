# MySQL for IS + DPDP, from the seeded image (schema loads on first start, into an empty volume).
# Single instance; the data lives on a nutanix-volume PVC that follows the pod between nodes.
#
# Needs, in the same namespace:
#   secret/mysql-root      key "password" - the MySQL root password (runtime only)
#   secret/dockerhub-pull  docker-registry secret for the private repo
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      securityContext:
        # mysql user in the official image; lets the volume be written without running as root.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: docker.io/<DOCKERHUB_USER>/wso2-dpdpiam:<MYSQL_IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: password
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The seed takes a few minutes on first start; the healthcheck only passes once it has
          # finished, so IS is not pointed at a half-built schema.
          startupProbe:
            exec:
              command: ["dpdp-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["dpdp-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot --silent"]
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Omitted: uses the cluster default (nutanix-volume on NKP).
        # storageClassName: nutanix-volume
        resources:
          requests:
            storage: 20Gi
